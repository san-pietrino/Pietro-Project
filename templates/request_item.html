<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Item - Pietro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .error {
            color: #d32f2f;
            background-color: #ffebee;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .categories-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        .category-option {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
        }
        .category-option input[type="radio"] {
            display: none;
        }
        .category-option input[type="radio"]:checked + label {
            background-color: #1976d2;
            color: white;
            border-color: #1976d2;
        }
        .category-option label {
            cursor: pointer;
            display: block;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔧 Pietro</h1>
            <nav>
                <a href="{{ url_for('dashboard') }}">Dashboard</a>
                <a href="{{ url_for('search') }}">Search</a>
                <a href="{{ url_for('logout') }}">Logout</a>
            </nav>
        </header>
        
        <main>
            <section class="request-form-section">
                <h2>📝 Request an Item</h2>
                <p class="form-description">Couldn't find what you're looking for? Let us know!</p>
                
                {% if error %}
                <div class="error">{{ error }}</div>
                {% endif %}
                
                <form method="POST" action="{{ url_for('request_item') }}" class="request-form">
                    <div class="form-group">
                        <label for="item_name">Item Name *</label>
                        <input type="text" id="item_name" name="item_name" required placeholder="What item do you need?">
                    </div>
                    
                    <div class="form-group">
                        <label>Category *</label>
                        <div class="categories-list">
                            {% for category in categories %}
                            <div class="category-option">
                                <input type="radio" id="cat_{{ loop.index }}" name="category" value="{{ category }}" required>
                                <label for="cat_{{ loop.index }}">{{ category }}</label>
                            </div>
                            {% endfor %}
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" rows="4" placeholder="Describe what you're looking for..."></textarea>
                        <small>Optional - provide details about what you need</small>
                    </div>
                    
                    <button type="submit" class="btn-primary">Submit Request</button>
                </form>
            </section>
        </main>
        
        <footer>
            <p>Made with ❤️ for community sharing</p>
        </footer>
    </div>
</body>
</html>

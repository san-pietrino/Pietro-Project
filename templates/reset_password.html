<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Pietro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .password-wrapper {
            position: relative;
        }
        .toggle-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px 10px;
        }
        .error {
            color: #d32f2f;
            margin-bottom: 15px;
            padding: 10px;
            background-color: #ffebee;
            border-radius: 4px;
        }
        .success {
            color: #388e3c;
            margin-bottom: 15px;
            padding: 10px;
            background-color: #e8f5e9;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔧 Pietro</h1>
            <p class="tagline">Reset your password</p>
        </header>
        
        <main>
            <div class="login-form">
                <h2>Create New Password</h2>
                
                {% if error %}
                <div class="error">{{ error }}</div>
                {% endif %}
                
                {% if message %}
                <div class="success">{{ message }}</div>
                {% endif %}
                
                {% if not message %}
                <form method="POST" action="{{ url_for('reset_password', token=token) }}">
                    <div class="form-group">
                        <label for="password">New Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" name="password" required placeholder="Enter your new password">
                            <button type="button" class="toggle-btn" onclick="togglePasswordVisibility('password')">👁️</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="password_confirm">Confirm Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password_confirm" name="password_confirm" required placeholder="Confirm your password">
                            <button type="button" class="toggle-btn" onclick="togglePasswordVisibility('password_confirm')">👁️</button>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary">Reset Password</button>
                </form>
                {% else %}
                <p class="register-link"><a href="{{ url_for('login') }}">Back to Login</a></p>
                {% endif %}
            </div>
        </main>
        
        <footer>
            <p>Made with ❤️ for community sharing</p>
        </footer>
    </div>
    
    <script>
        function togglePasswordVisibility(fieldId) {
            const field = document.getElementById(fieldId);
            const button = event.target;
            if (field.type === 'password') {
                field.type = 'text';
                button.textContent = '🙈';
            } else {
                field.type = 'password';
                button.textContent = '👁️';
            }
        }
    </script>
</body>
</html>

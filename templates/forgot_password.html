<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Pietro</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename="icon - It's called Pietro.svg") }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .message {
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .success-message {
            color: #388e3c;
            background-color: #e8f5e9;
        }
        .info-message {
            color: #1565c0;
            background-color: #e3f2fd;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><span class="icon icon-package" aria-hidden="true"></span> Pietro</h1>
            <p class="tagline">Need help with your password?</p>
        </header>
        
        <main>
            <div class="login-form">
                <h2>Password Recovery</h2>
                
                {% if message %}
                <div class="message success-message">{{ message }}</div>
                {% endif %}
                
                <form method="POST" action="{{ url_for('forgot_password') }}">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required placeholder="Enter the email associated with your account">
                        <small>We'll send you a link to reset your password</small>
                    </div>
                    <button type="submit" class="btn-primary">Send Reset Link</button>
                </form>
                <p class="register-link"><a href="{{ url_for('login') }}">Back to Login</a></p>
            </div>
        </main>
        
        <footer>
            <p>Made with <span class="icon icon-heart" aria-hidden="true"></span> for community sharing</p>
        </footer>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pietro - Peer-to-Peer Lending</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .password-toggle {
            cursor: pointer;
            user-select: none;
        }
        .password-wrapper {
            position: relative;
        }
        .toggle-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px 10px;
        }
        .error {
            color: #d32f2f;
            margin-bottom: 15px;
            padding: 10px;
            background-color: #ffebee;
            border-radius: 4px;
        }
        .success {
            color: #388e3c;
            margin-bottom: 15px;
            padding: 10px;
            background-color: #e8f5e9;
            border-radius: 4px;
        }
        .forgot-password-link {
            text-align: right;
            margin-top: 10px;
            font-size: 0.9em;
        }
        .forgot-password-link a {
            color: #1976d2;
            text-decoration: none;
        }
        .forgot-password-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔧 Pietro</h1>
            <p class="tagline">Borrow from your neighbors, lend to your friends</p>
        </header>
        
        <main>
            <div class="login-form">
                <h2>Welcome back!</h2>
                
                {% if error %}
                <div class="error">{{ error }}</div>
                {% endif %}
                
                {% if success_message %}
                <div class="success">{{ success_message }}</div>
                {% endif %}
                
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="form-group">
                        <label for="username">Username or Email</label>
                        <input type="text" id="username" name="username" required placeholder="Enter your username or email">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" name="password" required placeholder="Enter your password">
                            <button type="button" class="toggle-btn" onclick="togglePasswordVisibility()">👁️</button>
                        </div>
                    </div>
                    <div class="forgot-password-link">
                        <a href="{{ url_for('forgot_password') }}">Forgot your <span style="text-decoration: underline; cursor: pointer;">password</span>?</a>
                    </div>
                    <button type="submit" class="btn-primary">Login</button>
                </form>
                <p class="register-link">New to Pietro? <a href="{{ url_for('register') }}">Create an account</a></p>
            </div>
        </main>
        
        <footer>
            <p>Made with ❤️ for community sharing</p>
        </footer>
    </div>
    
    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const button = event.target;
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                button.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                button.textContent = '👁️';
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pietro - Peer-to-Peer Lending</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .password-toggle {
            cursor: pointer;
            user-select: none;
        }
        .password-wrapper {
            position: relative;
        }
        .toggle-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px 10px;
        }
        .error {
            color: #d32f2f;
            margin-bottom: 15px;
            padding: 10px;
            background-color: #ffebee;
            border-radius: 4px;
        }
        .success {
            color: #388e3c;
            margin-bottom: 15px;
            padding: 10px;
            background-color: #e8f5e9;
            border-radius: 4px;
        }
        .forgot-password-link {
            text-align: right;
            margin-top: 10px;
            font-size: 0.9em;
        }
        .forgot-password-link a {
            color: #ffffff;
            text-decoration: none;
        }
        .forgot-password-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-top">
                <h1>LOGIN</h1>
                <div class="login-avatar icon icon-user"></div>
            </div>
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
            {% if success_message %}
            <div class="success">{{ success_message }}</div>
            {% endif %}
            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label for="username">What’s your username?</label>
                    <input type="text" id="username" name="username" required placeholder="Pietro Indietro">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" required placeholder="...">
                        <button type="button" class="toggle-btn" onclick="togglePasswordVisibility()">👁️</button>
                    </div>
                </div>
                <div class="forgot-password-link">
                    <a href="{{ url_for('forgot_password') }}">Forgot your password?</a>
                </div>
                <button type="submit" class="btn-primary">Login</button>
            </form>
            <p class="register-link">New to Pietro? <a href="{{ url_for('register') }}">Create an account</a></p>
        </div>
    </div>
    
    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const button = event.target;
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                button.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                button.textContent = '👁️';
            }
        }
    </script>
</body>
</html>

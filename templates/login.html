<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pietro - Peer-to-Peer Lending</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename="icon - It's called Pietro.svg") }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Pietro">
    <meta name="theme-color" content="#0D21A4">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .password-toggle {
            cursor: pointer;
            user-select: none;
        }
        .password-wrapper {
            position: relative;
        }
        .toggle-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px 10px;
        }
        .error {
            color: var(--color-pink-dark);
            margin-bottom: 15px;
            padding: 10px;
            background-color: var(--color-pink-tint);
            border-radius: 12px;
            font-family: var(--font-body);
        }
        .success {
            color: #2f6b1f;
            margin-bottom: 15px;
            padding: 10px;
            background-color: var(--color-green-tint);
            border-radius: 12px;
            font-family: var(--font-body);
        }
        .login-options-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
            margin-bottom: 28px;
            font-size: 0.9em;
        }
        .remember-me-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--color-blue);
            font-weight: 600;
            cursor: pointer;
        }
        .remember-me-label input {
            accent-color: var(--color-blue);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .login-options-row a {
            color: var(--color-blue);
            text-decoration: none;
        }
        .login-options-row a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    {% include 'loading_screen.html' %}
    <div class="login-page">
        <div class="login-card">
            <div class="login-top">
                <h1>LOGIN</h1>
            </div>
            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
            {% if success_message %}
            <div class="success">{{ success_message }}</div>
            {% endif %}
            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label for="username">What’s your username?</label>
                    <input type="text" id="username" name="username" required placeholder="Pietro Indietro">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" required placeholder="...">
                        <button type="button" class="toggle-btn" onclick="togglePasswordVisibility()" aria-label="Show password">
                            <span class="icon icon-eye" aria-hidden="true"></span>
                        </button>
                    </div>
                </div>
                <div class="login-options-row">
                    <label class="remember-me-label">
                        <input type="checkbox" name="remember_me" value="1">
                        Remember me
                    </label>
                    <a href="{{ url_for('forgot_password') }}">Forgot your password?</a>
                </div>
                <button type="submit" class="btn-primary">Login</button>
            </form>
            <p class="register-link">New to Pietro? <a href="{{ url_for('register') }}">Create an account</a></p>
        </div>
    </div>
    
    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const button = event.target.closest('button');
            const icon = button.querySelector('.icon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('icon-eye');
                icon.classList.add('icon-eye-off');
                button.setAttribute('aria-label', 'Hide password');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('icon-eye-off');
                icon.classList.add('icon-eye');
                button.setAttribute('aria-label', 'Show password');
            }
        }
    </script>
</body>
</html>

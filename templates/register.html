<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Pietro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔧 Pietro</h1>
            <p class="tagline">Join your local sharing community</p>
        </header>
        
        <main>
            <div class="register-form">
                <h2>Create your account</h2>
                {% if error %}
                <div class="error-message">{{ error }}</div>
                {% endif %}
                <form method="POST" action="{{ url_for('register') }}">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required placeholder="Choose a username">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required placeholder="Choose a password">
                    </div>
                    <div class="form-group">
                        <label for="location">Your Location</label>
                        <input type="text" id="location" name="location" placeholder="e.g., Trastevere, Rome">
                        <small>Help others find items near you</small>
                    </div>
                    <div class="form-group">
                        <label for="keywords">Keywords of Interest</label>
                        <input type="text" id="keywords" name="keywords" placeholder="e.g., tools, electronics, sports">
                        <small>Get notified when items matching these keywords are added</small>
                    </div>
                    <button type="submit" class="btn-primary">Sign Up</button>
                </form>
                <p class="register-link">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
            </div>
        </main>
        
        <footer>
            <p>Made with ❤️ for community sharing</p>
        </footer>
    </div>
</body>
</html>

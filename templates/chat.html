<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Pietro</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename="icon - It's called Pietro.svg") }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="chat-page">
    <div class="container">
        <header class="chat-header">
            <a href="{{ url_for('chat_index') }}" class="chat-back" aria-label="Back"><span class="icon icon-back" aria-hidden="true"></span></a>
            <section class="chat-card-summary">
                <div class="chat-summary-name">{{ chat_partner }}</div>
                <p class="chat-summary-text">Looking for a {{ chat_request.item_name }}!!</p>
            </section>
        </header>

        <main>
            <div class="chat-messages">
                {% if messages %}
                    {% for msg in messages %}
                    <div class="message {% if msg.sender_id == session['user_id'] %}own{% else %}other{% endif %}">
                        <div class="message-body">
                            <p class="message-content">{{ msg.content }}</p>
                            <span class="timestamp">{{ msg.created_at }}</span>
                        </div>
                    </div>
                    {% endfor %}
                {% else %}
                    <p class="no-messages">No messages yet. Start the conversation!</p>
                {% endif %}
            </div>

            <form method="POST" action="{{ url_for('send_message', request_id=request_id) }}" class="chat-form">
                <input type="text" name="message" placeholder="Write a message :)" required>
                <button type="submit" class="chat-send-btn" aria-label="Send message">
                    <svg class="chat-send-icon" viewBox="0 0 24 24" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
                        <polyline points="9 5 16 12 9 19" />
                    </svg>
                </button>
            </form>
        </main>
    </div>
</body>
</html>
